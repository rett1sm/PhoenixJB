name: Build Phoenix JB IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project PhoenixJB.xcodeproj \
            -scheme PhoenixJB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoenixJB.app package/Payload/
          cd package
          zip -qry ../PhoenixJB-unsigned.ipa Payload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixJB-unsigned-IPA
          path: PhoenixJB-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Phoenix JB ${{ github.ref_name }}
          body: |
            Phoenix JB 1.0

            SwiftUI IPA manager preview.

            **Important:** this release is not a jailbreak. It does not include an exploit, bootstrap, Sileo/Zebra installer, or an unsigned-app runtime. The IPA is unsigned and requires a supported signing/installation method.
          files: PhoenixJB-unsigned.ipa
          fail_on_unmatched_files: true
