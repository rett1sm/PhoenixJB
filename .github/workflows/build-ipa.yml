name: Сборка Phoenix JB — бета

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phoenix-jb-beta-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка бета-версии 0.00
        run: |
          xcodebuild \
            -project PhoenixJB.xcodeproj \
            -scheme PhoenixJB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoenixJB.app package/Payload/
          cd package
          zip -qry ../PhoenixJB-0.00-beta-unsigned.ipa Payload

      - name: Сохранение IPA как артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixJB-0.00-beta-IPA
          path: PhoenixJB-0.00-beta-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Перевод предыдущего выпуска в архив
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release edit v1.0 \
              --title "Архивная сборка — заменена бетой 0.00" \
              --notes "Этот выпуск устарел и оставлен только для истории. Используй Phoenix JB 0.00 Beta: https://github.com/rett1sm/PhoenixJB/releases/tag/v0.00-beta" \
              --prerelease
          fi

      - name: Публикация бета-релиза 0.00
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.00-beta
          target_commitish: ${{ github.sha }}
          name: Phoenix JB 0.00 — бета
          prerelease: true
          make_latest: false
          body: |
            # Phoenix JB 0.00 — бета

            Это тестовая сборка Phoenix JB. Возможны ошибки, неполная функциональность и изменения без сохранения совместимости.

            ## В этой бете
            - тёмный интерфейс на SwiftUI;
            - отображение модели устройства и версии iOS;
            - выбор предпочтительного менеджера пакетов: Sileo или Zebra;
            - локальный список источников и репозиториев.

            ## Что пока не работает
            - настоящий jailbreak и запуск эксплойта;
            - установка Sileo, Zebra и DEB-пакетов;
            - загрузка индексов репозиториев;
            - запуск неподписанных IPA внутри Phoenix по модели LiveContainer.

            При добавлении источника сейчас сохраняется только его URL. IPA в этом выпуске не подписан и сам по себе не устанавливается на iPhone.
          files: PhoenixJB-0.00-beta-unsigned.ipa
          fail_on_unmatched_files: true
