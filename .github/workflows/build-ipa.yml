name: Build Phoenix JB IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project PhoenixJB.xcodeproj \
            -scheme PhoenixJB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoenixJB.app package/Payload/
          cd package
          zip -qry ../PhoenixJB-1.0-unsigned.ipa Payload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixJB-1.0-unsigned-IPA
          path: PhoenixJB-1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish Phoenix JB 1.0 to Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0' }}
          target_commitish: ${{ github.sha }}
          name: Phoenix JB 1.0
          body: |
            # Phoenix JB 1.0

            Initial public preview release of the Phoenix JB iOS interface.

            ## Included
            - SwiftUI dark interface
            - device and iOS version display
            - Sileo / Zebra preference selector
            - local repository/source list

            ## Important
            This is an unsigned IPA preview, **not a jailbreak**. It does not contain an exploit, bootstrap, Sileo/Zebra installer, package installation backend, or a LiveContainer-compatible unsigned app runtime. Repository URLs are stored locally only.
          files: PhoenixJB-1.0-unsigned.ipa
          fail_on_unmatched_files: true
