name: Сборка Phoenix JB — бета

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phoenix-jb-beta-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка приложения
        run: |
          xcodebuild \
            -project PhoenixJB.xcodeproj \
            -scheme PhoenixJB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoenixJB.app package/Payload/
          cd package
          zip -qry ../PhoenixJB-0.00-beta-unsigned.ipa Payload

      - name: Сохранение IPA как артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixJB-0.00-beta-IPA
          path: PhoenixJB-0.00-beta-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Пометить прежний выпуск как архивный
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release edit v1.0 \
              --title "Архив · Phoenix JB 1.0" \
              --notes "Предыдущая тестовая сборка. Актуальная версия: https://github.com/rett1sm/PhoenixJB/releases/tag/v0.00-beta" \
              --prerelease
          fi

      - name: Публикация бета-релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.00-beta
          target_commitish: ${{ github.sha }}
          name: Phoenix JB 0.00 · Beta
          prerelease: true
          make_latest: false
          body: |
            # Phoenix JB 0.00 · Beta

            Первая открытая тестовая сборка Phoenix JB.

            ## Внутри
            - обновлённый тёмный интерфейс;
            - обзор устройства и состояния среды;
            - выбор Sileo или Zebra;
            - локальная библиотека IPA;
            - импорт IPA из приложения «Файлы»;
            - загрузка IPA по прямой ссылке;
            - добавление и хранение адресов репозиториев.

            ## Ограничения беты
            Phoenix пока не является джейлбрейком. Эксплойт, bootstrap, установка Sileo/Zebra и DEB-пакетов не подключены. Запуск неподписанных приложений внутри Phoenix по модели LiveContainer также пока не реализован.

            Файлы IPA в библиотеке хранятся внутри контейнера приложения и не устанавливаются в iOS. Сборка не подписана.
          files: PhoenixJB-0.00-beta-unsigned.ipa
          fail_on_unmatched_files: true
