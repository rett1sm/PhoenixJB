name: Сборка Phoenix JB IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка приложения
        run: |
          xcodebuild \
            -project PhoenixJB.xcodeproj \
            -scheme PhoenixJB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoenixJB.app package/Payload/
          cd package
          zip -qry ../PhoenixJB-1.0-unsigned.ipa Payload

      - name: Сохранение IPA как артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixJB-1.0-unsigned-IPA
          path: PhoenixJB-1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Публикация Phoenix JB 1.0 в Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0' }}
          target_commitish: ${{ github.sha }}
          name: Phoenix JB 1.0 — первый выпуск
          body: |
            # Phoenix JB 1.0

            Первый публичный предварительный выпуск интерфейса Phoenix JB для iPhone.

            ## Что входит
            - тёмный интерфейс на SwiftUI;
            - отображение модели устройства и версии iOS;
            - выбор предпочтительного менеджера пакетов: Sileo или Zebra;
            - локальный список источников и репозиториев.

            ## Важно
            Это IPA с интерфейсом, **а не джейлбрейк**. В сборке нет эксплойта, bootstrap, установщика Sileo/Zebra, механизма установки пакетов или совместимого с LiveContainer движка запуска неподписанных приложений. Адреса репозиториев пока только сохраняются на устройстве.
          files: PhoenixJB-1.0-unsigned.ipa
          fail_on_unmatched_files: true
